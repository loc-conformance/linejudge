trap = """
a raw string whose last byte is a backslash, written with the same symbol at both ends. A
backtick string in Odin escapes nothing, so the second backtick closes it whatever precedes it.
The block comment opens after the string on the same line, so a counter that leaves the string
open hides the opener whether its strings end with the line or run on. The string runs over three
lines and the middle one holds only //, so a counter that reads no raw string at all counts that
line as a comment"""
