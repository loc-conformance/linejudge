name: Version check

# Once a week it reads the adapters, asks each channel what it publishes newest, and for each
# counter whose declared version has moved it fetches the new build, records what that build
# answers over every case, and opens a pull request carrying both. It publishes nothing: a version
# we measure changes only by somebody merging one of these.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  find-what-moved:
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.ask.outputs.moved }}

    steps:
      - uses: actions/checkout@v7

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and the build dir
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features maintenance

      # A channel that could not be answered is a warning and not the end of the run: the counters
      # that did answer still get their pull request, and the one that did not is asked again next
      # week. The document is the whole of stdout, so nothing has to be parsed out of a report.
      - name: Ask every channel what it publishes newest
        id: ask
        run: |
          set +e
          moved=$(./target/release/linejudge bump-versions --json --adapters adapters)
          asked=$?
          set -e
          # A run that failed before it could report prints nothing at all, and an empty value here
          # is not the empty list: it would pass the gate below and reach fromJSON as a parse error.
          if [ -z "$moved" ]; then moved='[]'; fi
          echo "moved=$moved" >> "$GITHUB_OUTPUT"
          echo "$moved"
          if [ "$asked" -ne 0 ]; then
            echo "::warning::a channel could not be asked, and the counters it covers were skipped"
          fi

  raise:
    needs: find-what-moved
    if: needs.find-what-moved.outputs.moved != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    # One job and one pull request per counter, because each raise brings its own recorded answers
    # and its own reading. One failing leaves the others to finish.
    strategy:
      fail-fast: false
      matrix:
        bump: ${{ fromJSON(needs.find-what-moved.outputs.moved) }}

    steps:
      - uses: actions/checkout@v7

      # The branch carries the version, so it is written once and never again. A second run over
      # the same raise finds it there and stops, which is what makes it safe to work on this branch
      # by hand: nothing here will ever force push over what somebody added to it.
      - name: Has this raise been opened already
        id: branch
        run: |
          branch="bump-${{ matrix.bump.counter }}-${{ matrix.bump.to }}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "already=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::$branch is already there, so this raise has been opened"
          else
            echo "already=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the Rust toolchain
        if: steps.branch.outputs.already == 'no'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and the build dir
        if: steps.branch.outputs.already == 'no'
        uses: Swatinem/rust-cache@v2

      - name: Build
        if: steps.branch.outputs.already == 'no'
        run: cargo build --release --features maintenance

      - name: Raise the version this counter declares
        if: steps.branch.outputs.already == 'no'
        run: |
          ./target/release/linejudge bump-versions "${{ matrix.bump.counter }}" \
            --adapters adapters
          git diff --stat

      # The build just declared is downloaded, or compiled where the channel hands over source,
      # and run over every case, so the pull request arrives with its answers already recorded.
      # What that leaves for a person is the reading: a note on any case that started failing.
      - name: Fetch the new build and record what it answers
        if: steps.branch.outputs.already == 'no'
        id: record
        env:
          COUNTER: ${{ matrix.bump.counter }}
        run: |
          ./target/release/linejudge fetch "$COUNTER"
          ./target/release/linejudge record --counter "$COUNTER" | tee "$RUNNER_TEMP/record"
          # record holds the answers it measured beside the record it replaced, so it says what
          # moved. Reading the file back cannot, since a variation written as a pointer at another
          # carries no flag of its own.
          keys_saying() {
            { grep "$1" "$RUNNER_TEMP/record" || true; } | awk '{ print $NF }' | sort
          }
          keys_saying 'stopped failing' > "$RUNNER_TEMP/fixed"
          keys_saying 'started failing' > "$RUNNER_TEMP/started"
          # A note dropped from a case that still fails means its answer moved without passing,
          # so the old note no longer describes what the counter does.
          keys_saying 'note dropped' | comm -23 - "$RUNNER_TEMP/fixed" > "$RUNNER_TEMP/unexplained"
          if [ -s "$RUNNER_TEMP/started" ] || [ -s "$RUNNER_TEMP/unexplained" ]; then
            echo "needs_reading=yes" >> "$GITHUB_OUTPUT"
          else
            echo "needs_reading=no" >> "$GITHUB_OUTPUT"
          fi
          git diff --stat

      # A pull request opened with the run's own token starts no CI, which github suppresses so
      # that a workflow cannot set itself off. A workflow_dispatch is the one exception it allows,
      # so the run asks for one on the branch and the checks arrive with the pull request.
      - name: Open the pull request
        if: steps.branch.outputs.already == 'no'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          COUNTER: ${{ matrix.bump.counter }}
          FROM: ${{ matrix.bump.from }}
          TO: ${{ matrix.bump.to }}
          NEEDS_READING: ${{ steps.record.outputs.needs_reading }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qam "declare $COUNTER $TO"
          git push -q origin "$BRANCH"
          list() { sed 's/^/- /' "$RUNNER_TEMP/$1"; echo; }
          {
            echo "\`$COUNTER\` declared **$FROM**, and its channel now publishes **$TO**. This branch"
            echo "declares the new version and carries what that build answers over every case,"
            echo "recorded by the run that opened it."
            echo
            if [ -s "$RUNNER_TEMP/fixed" ]; then
              echo "Cases it now passes:"; echo; list fixed
            fi
            if [ -s "$RUNNER_TEMP/started" ]; then
              echo "Cases it has started failing. Each needs a note beside its answer in"
              echo "\`recorded/$COUNTER.toml\`, measured before it is written:"; echo; list started
            fi
            if [ -s "$RUNNER_TEMP/unexplained" ]; then
              echo "Cases that still fail with a different answer. The old note was dropped and"
              echo "each needs a new one:"; echo; list unexplained
            fi
            if [ "$NEEDS_READING" = no ] && [ ! -s "$RUNNER_TEMP/fixed" ]; then
              echo "Every case answers as it did before."; echo
            fi
            echo "Nothing here will ever be force pushed over: this branch carries the version in its"
            echo "name, so the weekly run sees it and leaves it alone."
          } > "$RUNNER_TEMP/body.md"
          draft=""
          if [ "$NEEDS_READING" = yes ]; then draft="--draft"; fi
          gh pr create --head "$BRANCH" --title "declare $COUNTER $TO" \
            --body-file "$RUNNER_TEMP/body.md" $draft
          gh workflow run ci.yml --ref "$BRANCH"
