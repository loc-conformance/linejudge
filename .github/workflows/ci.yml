name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform runs to completion, so that a failure on one still reports the others
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo registry and the build dir
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --verbose

      # --all-features on both, and it is not decoration: a binary behind a feature falls out of
      # the lint and out of the suite without it, and neither says so. Measured, a deliberate
      # unused variable inside the gated tool went unreported until --all-features was added, and
      # its ten tests stop running the same way.
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features --verbose

      # The corpus is read byte for byte and its answers are compared across machines, so a
      # checkout that rewrote line endings would fail in ways that look like counting bugs.
      # It looks for CRLF rather than for the absence of LF: a counter's captured answer that is
      # one line with no newline after it has no line ending at all to be LF, and nor has a file
      # git reads as binary.
      - name: No file was checked out with CRLF
        shell: bash
        run: |
          if git ls-files --eol | grep -E "w/(crlf|mixed)"; then
            echo "the working copy holds a file with CRLF line endings"; exit 1
          fi
