name       = "scc"
repository = "https://github.com/boyter/scc"
args       = ["--format", "json", "{file}"]
# The trace prints one `line N ended with state: S: counted as X` per line of the file, which is
# scc's own per-line answer even though its JSON never carries one.
explain-args   = ["-t", "--no-cocomo", "--format", "json", "{file}"]
explain-output = "scc-trace"

[acquisition]
channel = "github-release-asset"
name    = "boyter/scc"
version = "4.0.0"

[dialect.default]
args = []

[dialect.default.read]
each     = "[]"
lines    = "Lines"
code     = "Code"
comments = "Comment"
blanks   = "Blank"
