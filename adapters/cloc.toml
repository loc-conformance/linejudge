name       = "cloc"
repository = "https://github.com/AlDanial/cloc"
args       = ["--json", "{file}"]

# cloc says nothing about where it put each line, so the reader works that out from the filter
# stages it prints.
explain-args   = ["--print-filter-stages", "--json", "{file}"]
explain-output = "cloc-stages"

[acquisition]
channel = "github-release-file"
name    = "AlDanial/cloc"
version = "2.10"

[acquisition.file]
windows = "cloc-{version}.exe"
other   = "cloc-{version}.pl"

[variation.default]
dialect = "default"
major   = true
args    = []

[variation.default.read]
claims   = "SUM"
lines    = "header.n_lines"
code     = "SUM.code"
comments = "SUM.comment"
blanks   = "SUM.blank"

# The same five rules reached by a different path inside cloc, which strips a comment opener that
# sits inside a string before its comment filters ever run.
[variation.stripstr]
dialect = "default"
args    = ["--strip-str-comments"]
