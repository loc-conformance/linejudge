name       = "mezura"
repository = "https://github.com/subamanis/mezura"
args       = ["{file}", "--output", "json", "--hide", "timing", "--no-default-config", "--no-local"]
explain-args   = ["{file}", "--explain", "--output", "json", "--no-default-config", "--no-local"]
explain-output = "linejudge-per-line"

[acquisition]
channel = "crates-io"
name    = "mezura"
version = "3.2.0"

[variation.content]
dialect = "content"
major   = true
args    = ["--counting", "content"]

[variation.content.read]
claims   = "languages[]"
lines    = "total.lines"
code     = "total.code"
comments = "total.comments"
extra    = "total.extra"

[variation.content.read.regions]
each     = "languages[].nested_languages[]"
language = "name"
lines    = "lines"
code     = "code"
comments = "comments"
extra    = "extra"

[variation.region]
dialect = "region"
major   = true
args    = ["--counting", "region"]

[variation.region.read]
claims   = "languages[]"
lines    = "total.lines"
code     = "total.code"
comments = "total.comments"
blanks   = "total.blanks"

[variation.region.read.regions]
each     = "languages[].nested_languages[]"
language = "name"
lines    = "lines"
code     = "code"
comments = "comments"
blanks   = "blanks"
