[package]
name = "linejudge"
version = "0.1.0"
authors = ["Petros Papatheodorou <petrospapa21@gmail.com>"]
edition = "2024"
rust-version = "1.88"
description = "The test corpus and engine that check line-of-code counters against their own declared rules"
license = "MIT OR Apache-2.0"
repository = "https://github.com/loc-conformance/linejudge"
homepage = "https://loc-conformance.github.io/linejudge/"
keywords = ["lines-of-code", "loc", "conformance", "test-corpus", "loc-testing"]
categories = ["development-tools::testing", "development-tools"]
exclude = [".github"]

[[bin]]
name = "linejudge"
path = "src/bin/linejudge/main.rs"
required-features = ["cli"]

[[bin]]
name = "propose-markers"
path = "src/bin/propose-markers/main.rs"
required-features = ["maintenance"]

[features]
default = ["cli"]
# Only the linejudge executable needs these three, so a project that brings the library as a
# dependency turns the feature off and does not build them.
cli = ["dep:colored", "dep:maud", "dep:sha2"]
# Holds propose-markers above and the bump-versions command, both run in a checkout of this repo.
maintenance = ["cli"]

[dependencies]
# Exactly this version: 2.1 onwards throws away a colour given as three numbers unless the
# environment declares COLORTERM, which Windows terminals do not, and the whole palette falls to
# the nearest of sixteen. Raising it means writing the escape codes here instead.
colored = { version = "=2.0.0", optional = true }
maud = { version = "0.27.0", optional = true }
sha2 = { version = "0.11.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }

[profile.release]
debug = false
strip = "symbols"
